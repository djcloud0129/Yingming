<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>樱茗</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="companion-panel" aria-label="樱茗">
        <div class="portrait-wrap">
          <img src="/assets/yingming-portrait.png" alt="樱茗头像" class="portrait">
        </div>
        <div class="identity">
          <p class="eyebrow">Yingming</p>
          <h1>樱茗</h1>
          <div class="status-row">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="modelStatus">连接中</span>
          </div>
        </div>
        <div class="quick-memory">
          <label for="memoryText">长期记忆</label>
          <textarea id="memoryText" rows="4" placeholder="想让樱茗记住的事"></textarea>
          <div class="memory-actions">
            <select id="memoryCategory" aria-label="记忆类别">
              <option value="manual">手动</option>
              <option value="preference">偏好</option>
              <option value="project">项目</option>
              <option value="boundary">边界</option>
              <option value="shared_joke">专属梗</option>
            </select>
            <button id="saveMemory" class="icon-button primary" type="button" title="保存记忆" aria-label="保存记忆">
              <span aria-hidden="true">✓</span>
            </button>
          </div>
        </div>
      </aside>

      <main class="chat-panel" aria-label="聊天">
        <header class="chat-header">
          <div>
            <p class="eyebrow">文字版</p>
            <h2>和樱茗聊天</h2>
          </div>
          <div class="header-actions">
            <button id="refreshState" class="icon-button" type="button" title="刷新" aria-label="刷新">
              <span aria-hidden="true">↻</span>
            </button>
            <button id="clearHistory" class="icon-button danger" type="button" title="清空聊天" aria-label="清空聊天">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer">
          <textarea id="chatInput" rows="2" placeholder="和樱茗说点什么..." autocomplete="off"></textarea>
          <button id="sendButton" class="send-button" type="submit">
            <span>发送</span>
            <span aria-hidden="true">↗</span>
          </button>
        </form>
      </main>

      <aside class="workspace-panel" aria-label="资料">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-tab="memory">记忆</button>
          <button class="tab" type="button" data-tab="profile">画像</button>
          <button class="tab" type="button" data-tab="import">导入</button>
        </div>

        <section id="tab-memory" class="tab-panel active">
          <div id="memoryList" class="memory-list"></div>
        </section>

        <section id="tab-profile" class="tab-panel">
          <textarea id="profileEditor" class="profile-editor" spellcheck="false"></textarea>
          <button id="saveProfile" class="wide-button" type="button">保存画像</button>
        </section>

        <section id="tab-import" class="tab-panel">
          <input id="chatgptFile" class="file-input" type="file" accept=".json,application/json">
          <textarea id="importDraft" class="profile-editor" readonly placeholder="导入后会出现画像草稿"></textarea>
        </section>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
